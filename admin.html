<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard</title>

  <style>

    body{
      margin:0;
      padding:30px;
      background:#0f172a;
      font-family:Arial;
      color:white;
    }

    h1{
      text-align:center;
      margin-bottom:30px;
    }

    .dashboard{
      max-width:900px;
      margin:auto;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:20px;
      margin-bottom:30px;
    }

    .card{
      background:#1e293b;
      padding:20px;
      border-radius:12px;
      text-align:center;
    }

    .card h2{
      margin:0;
      font-size:30px;
      color:#38bdf8;
    }

    .form-container{
      background:#1e293b;
      padding:25px;
      border-radius:12px;
      margin-bottom:30px;
    }

    input{
      width:100%;
      padding:14px;
      margin-top:10px;
      border:none;
      border-radius:8px;
      background:#334155;
      color:white;
      font-size:15px;
    }

    button{
      margin-top:15px;
      padding:14px;
      width:100%;
      border:none;
      border-radius:8px;
      background:#2563eb;
      color:white;
      font-size:16px;
      cursor:pointer;
    }

    button:hover{
      background:#1d4ed8;
    }

    .shipment-card{
      background:#1e293b;
      padding:20px;
      border-radius:12px;
      margin-bottom:20px;
    }

    .progress-bar{
      width:100%;
      height:12px;
      background:#334155;
      border-radius:20px;
      overflow:hidden;
      margin-top:10px;
    }

    .progress{
      height:100%;
      background:#22c55e;
    }

  </style>

</head>

<body>

  <div class="dashboard">

    <h1>Apex Global Logistics</h1>

    <div class="stats">

      <div class="card">
        <p>Total Shipments</p>
        <h2 id="totalShipments">0</h2>
      </div>

      <div class="card">
        <p>In Transit</p>
        <h2 id="transitShipments">0</h2>
      </div>

      <div class="card">
        <p>Delivered</p>
        <h2 id="deliveredShipments">0</h2>
      </div>

    </div>



    <div class="form-container">

      <h2>Create Shipment</h2>

      <input
      type="text"
      id="trackingId"
      placeholder="Tracking ID">

      <input
      type="text"
      id="customerName"
      placeholder="Customer Name">

      <input
      type="text"
      id="currentLocation"
      placeholder="Current Location">

      <input
      type="text"
      id="shipmentStatus"
      placeholder="Shipment Status">

      <input
      type="number"
      id="progress"
      placeholder="Progress %">

      <button onclick="addShipment()">
        Add Shipment
      </button>

    </div>



    <h2>All Shipments</h2>

    <div id="shipmentList"></div>

  </div>



 <script type="module" src="./admin.js"></script>

</body>
</html>
