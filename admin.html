<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Apex Global Logistics — Admin Dashboard</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 20px;
      background:
        radial-gradient(
          circle at top,
          #1e3a5f 0%,
          #0f172a 45%,
          #020617 100%
        );
      font-family: Arial, sans-serif;
      color: white;
      min-height: 100vh;
    }

    .dashboard {
      width: 100%;
      max-width: 1100px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .header h1 {
      color: #38bdf8;
      margin-bottom: 8px;
    }

    .header p {
      color: #94a3b8;
      margin: 0;
    }

    .stats {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: rgba(30, 41, 59, 0.95);
      padding: 25px;
      border-radius: 18px;
      text-align: center;
      border: 1px solid
        rgba(148, 163, 184, 0.12);
      box-shadow:
        0 15px 35px
        rgba(0, 0, 0, 0.25);
    }

    .card p {
      color: #94a3b8;
      margin-bottom: 10px;
    }

    .card h2 {
      margin: 0;
      font-size: 34px;
      color: #38bdf8;
    }

    .section {
      background: rgba(30, 41, 59, 0.95);
      padding: 25px;
      border-radius: 18px;
      margin-bottom: 30px;
      border: 1px solid
        rgba(148, 163, 184, 0.12);
      box-shadow:
        0 15px 35px
        rgba(0, 0, 0, 0.25);
    }

    .section h2 {
      margin-top: 0;
      color: #38bdf8;
    }

    .form-grid {
      display: grid;
      grid-template-columns:
        repeat(2, 1fr);
      gap: 15px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #475569;
      border-radius: 10px;
      background: #0f172a;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #38bdf8;
      box-shadow:
        0 0 0 3px
        rgba(56, 189, 248, 0.12);
    }

    button {
      margin-top: 18px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background:
        linear-gradient(
          135deg,
          #2563eb,
          #38bdf8
        );
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition:
        transform 0.2s,
        box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow:
        0 8px 25px
        rgba(37, 99, 235, 0.35);
    }

    #shipmentList {
      margin-top: 15px;
    }

    .empty-message {
      color: #94a3b8;
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 700px) {

      .stats {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      body {
        padding: 20px 12px;
      }

    }

  </style>

</head>


<body>

  <div class="dashboard">

    <div class="header">

      <h1>
        Apex Global Logistics
      </h1>

      <p>
        Shipment Management Dashboard
      </p>

    </div>


    <div class="stats">

      <div class="card">

        <p>
          Total Shipments
        </p>

        <h2 id="totalShipments">
          0
        </h2>

      </div>


      <div class="card">

        <p>
          In Transit
        </p>

        <h2 id="transitShipments">
          0
        </h2>

      </div>


      <div class="card">

        <p>
          Delivered
        </p>

        <h2 id="deliveredShipments">
          0
        </h2>

      </div>

    </div>


    <div class="section">

      <h2>
        📦 Create Shipment
      </h2>

      <div class="form-grid">

        <input
          type="text"
          id="trackingId"
          placeholder="Tracking ID">

        <input
          type="text"
          id="customerName"
          placeholder="Customer Name">

        <input
          type="text"
          id="currentLocation"
          placeholder="Current Location">

        <input
          type="text"
          id="shipmentStatus"
          placeholder="Shipment Status">

        <input
          type="number"
          id="progress"
          placeholder="Progress %"
          min="0"
          max="100">

      </div>

      <button onclick="addShipment()">

        Add Shipment

      </button>

    </div>


    <div class="section">

      <h2>
        📋 All Shipments
      </h2>

      <div id="shipmentList">

        <div class="empty-message">
          Loading shipments...
        </div>

      </div>

    </div>

  </div>


  <script
    type="module"
    src="./admin.js">
  </script>

</body>

</html>
